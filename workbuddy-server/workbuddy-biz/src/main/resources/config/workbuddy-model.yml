# 模型环节配置的落点：厂商连接（workbuddy.model.vendors）。
# 键的来源：workbuddy-model 的 ModelVendorProperties（前缀 workbuddy.model）。
# 接入的厂商：阿里百炼（dashscope）与 DeepSeek。厂商码即 Map 键，也是 wb_model.vendor_code 的取值：
# 保存模型时校验该键必须存在于本文件，页面下拉的候选（workbuddy-web/src/types/model.ts 的 MODEL_VENDORS）与之同名，新增厂商两处同步。
# 密钥一律走环境变量占位符（带空默认）：解析不出来（未设置或为空）启动失败，错误信息带厂商码与配置键。

workbuddy:
  model:
    # 路由与容量：冷却/熔断/slow start/尝试上限/ token 估算（键来源 ModelRouteProperties）
    route:
      cooldown-seconds: 60
      slow-start-seconds: 45
      error-trigger-ratio: 0.05
      error-window-seconds: 60
      max-attempts: 3
    vendors:
      # 阿里百炼：OpenAI 兼容端点，base-url 留空即取适配器内置默认地址（https://dashscope.aliyuncs.com/compatible-mode/v1）
#      dashscope:
#        auth-type: BEARER
#        api-key: ${DASHSCOPE_API_KEY:}
#        timeout-ms: 60000
#        max-retries: 2
#        display-name: 阿里百炼
      # DeepSeek：OpenAI 兼容格式，base-url 不带 /v1（官方口径 https://api.deepseek.com）
      deepseek:
        base-url: https://api.deepseek.com
        auth-type: BEARER
        api-key: ${DEEPSEEK_API_KEY:}
        timeout-ms: 60000
        display-name: DeepSeek
