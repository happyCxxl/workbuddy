server:
  port: 4388

spring:
  # 环节配置导入清单：逐个显式列出（spring.config.import 不支持通配符）。
  # 顺序即覆盖顺序（后导入覆盖先导入）；清单里的文件必须存在，缺文件或名字写错时启动即报错。
  # 新增环节：平台级配置放 config/workbuddy-<域>.yml，知识库功能专属配置放 config/knowledge/knowledge-<域>.yml，在此加一行。
  # 某个环节整块搬到拥有它的模块时：文件内容与文件名不变，这一行也不用改（classpath: 在整个 classpath 上按唯一匹配定位）。
  config:
    import:
      - classpath:config/workbuddy-auth.yml
      - classpath:config/workbuddy-file.yml
      - classpath:config/workbuddy-model.yml
      - classpath:config/knowledge/knowledge-task.yml
      - classpath:config/knowledge/knowledge-parse.yml
      - classpath:config/knowledge/knowledge-retrieval.yml
  application:
    name: @artifactId@
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/workbuddy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

knowledge:
  mybatis:
    show-sql: false
  operation-log:
    enabled: false

# 运维端点：只暴露健康探针与指标；health 免认证，metrics 需携带凭证（见 SecurityConfig）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics


