# 模型环节配置的落点：厂商连接（knowledge.model.vendors）与路由参数（knowledge.model.route）。
# 键的来源：knowledge-model 的 ModelVendorProperties（前缀 knowledge.model.vendors）与 ModelRouteProperties（前缀 knowledge.model.route）。
# 接入的厂商：阿里百炼（dashscope）与 DeepSeek。厂商码即 Map 键，也是 wb_model.vendor_code 的取值：
# 保存模型时校验该键必须存在于本文件，页面下拉的候选（web/src/types/model.ts 的 MODEL_VENDORS）与之同名，新增厂商两处同步。
# 密钥一律走环境变量占位符（带空默认）：解析不出来（未设置或为空）启动失败，错误信息带厂商码与配置键。

knowledge:
  model:
    vendors:
      # 阿里百炼：OpenAI 兼容端点，base-url 留空即取适配器内置默认地址（https://dashscope.aliyuncs.com/compatible-mode/v1）
      dashscope:
        auth-type: BEARER
        api-key: ${DASHSCOPE_API_KEY:}
        timeout-ms: 60000
        max-retries: 2
      # DeepSeek：OpenAI 兼容格式，base-url 不带 /v1（官方口径 https://api.deepseek.com）
      deepseek:
        base-url: https://api.deepseek.com
        auth-type: BEARER
        api-key: ${DEEPSEEK_API_KEY:}
        timeout-ms: 60000

    # 路由参数：三信号打分权重、窗口、熔断与恢复时长；全部有代码侧默认值，整段缺省也能启动。
    # route:
    #   beta-capacity: 1.0              # 容量占用权重
    #   beta-latency: 0.5               # 延迟权重
    #   latency-window-seconds: 300     # 延迟 EWMA 窗口（秒）
    #   capacity-trigger-ratio: 0.8     # 占用越线比例，区间 (0,1]
    #   error-trigger-ratio: 0.05       # 错误率越线比例，区间 (0,1]
    #   error-window-seconds: 60        # 熔断统计窗口（秒）
    #   cooldown-seconds: 60            # 熔断打开保持时长（秒）
    #   slow-start-seconds: 45          # 恢复放行爬升时长（秒）
