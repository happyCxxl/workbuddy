# CI 门禁：本地推送门禁（.agent/tools/common/pre-push-gate.sh）的远端强制版——本地钩子可被 --no-verify 绕过，CI 不可以。
# 与本地版的差异：无推送范围概念，跑全量；mvn 不带 -o（远端首次需联网拉依赖）。
# 新语言/新功能域接入时在此追加检查步骤（`.agent/standards/common/06-协作流程.md` §7）。
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lingxi
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: lingxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21（带 Maven 依赖缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 pnpm（版本读 workbuddy-web/package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4
        with:
          package_json_file: workbuddy-web/package.json

      - name: 安装 Node 24（带 pnpm 依赖缓存）
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: workbuddy-web/pnpm-lock.yaml

      - name: 文档结构
        run: node .agent/tools/common/check-docs.mjs

      - name: 文件编码
        run: node .agent/tools/common/check-encoding.mjs

      - name: AGENTS 入口体检
        run: node .agent/tools/common/check-agents.mjs

      - name: 规范边界（.agent 自包含）
        run: node .agent/tools/common/check-scope.mjs

      - name: 中间产物不入库
        run: node .agent/tools/common/check-artifacts.mjs

      - name: 项目档案漂移（仓库自带项目层验证器则运行）
        run: if [ -f .project/tools/check-project-docs.mjs ]; then node .project/tools/check-project-docs.mjs; fi

      - name: Java 形态检查
        run: node .agent/tools/java/check-java-conventions.mjs

      - name: Javadoc 检查
        run: node .agent/tools/java/check-javadoc.mjs

      - name: 用例质量检查
        run: node .agent/tools/java/check-test-quality.mjs

      - name: 模块结构检查
        run: node .agent/tools/common/check-modules.mjs

      - name: 前端全量检查
        working-directory: workbuddy-web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint

      - name: 安装 uv 与 Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Python 全量校验（ruff + pyright + pytest）
        working-directory: workbuddy-lingxi
        run: |
          printf '[llm]\napi_key = "fake"\n' > config.local.toml
          uv sync --frozen
          uv run alembic upgrade head
          uv run ruff check
          uv run ruff format --check
          uv run pyright
          uv run pytest

      - name: 后端全量门禁（Checkstyle + PMD + CPD + SpotBugs + 单测 + JaCoCo）
        working-directory: workbuddy-server
        run: mvn -B verify
