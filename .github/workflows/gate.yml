# CI 门禁：本地推送门禁（.agent/tools/common/pre-push-gate.sh）的远端强制版——本地钩子可被 --no-verify 绕过，CI 不可以。
# 与本地版的差异：无推送范围概念，跑全量；mvn 不带 -o（远端首次需联网拉依赖）。
# 新语言/新功能域接入时在此追加检查步骤（CONTRIBUTING §7）。
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21（带 Maven 依赖缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 pnpm（版本读 web/package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: 安装 Node 24（带 pnpm 依赖缓存）
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 文档结构
        run: node .agent/tools/common/check-docs.mjs

      - name: 文件编码
        run: node .agent/tools/common/check-encoding.mjs

      - name: AGENTS 入口体检
        run: node .agent/tools/common/check-agents.mjs

      - name: 中间产物不入库
        run: node .agent/tools/common/check-artifacts.mjs

      - name: 项目档案漂移（仓库自带项目层验证器则运行）
        run: if [ -f .project/tools/check-project-docs.mjs ]; then node .project/tools/check-project-docs.mjs; fi

      - name: Java 形态检查
        run: node .agent/tools/java/check-java-conventions.mjs

      - name: Javadoc 检查
        run: node .agent/tools/java/check-javadoc.mjs

      - name: 用例质量检查
        run: node .agent/tools/java/check-test-quality.mjs

      - name: 模块结构检查
        run: node .agent/tools/common/check-modules.mjs

      - name: 前端全量检查
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint

      - name: 后端全量门禁（Checkstyle + PMD + CPD + SpotBugs + 单测 + JaCoCo）
        run: mvn -B verify
